[project]
name = "telemetry_ansible"
version = "1.0.0"
description = "Run ad-hoc commands across Telemetry instances"
authors = [{ name = "Team Telemetry", email = "telemetry@digital.hmrc.gov.uk" }]
license = "Apache 2.0"
maintainers = [{ name = "Team Telemetry", email = "telemetry@digital.hmrc.gov.uk" }]
readme = "README.md"
requires-python = "==3.14.6"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "ansible-core>=2.21.3",
    "boto3",
    "botocore",
    "pyyaml",
]

[tool.uv]
package = false
default-groups = "all"

[[tool.uv.index]]
name = "artifactory"
url = "https://artefacts.tax.service.gov.uk/artifactory/api/pypi/pips/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
