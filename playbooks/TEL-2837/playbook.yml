---
- name: Network Getting Started First Playbook
  gather_facts: true
  hosts: all
  tasks:
    - name: Check installed systemd version
      ansible.builtin.command: dpkg-query -W -f='${Version}' systemd
      register: systemd_version
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Show systemd version
      ansible.builtin.debug:
        msg: "Systemd version: {{ systemd_version.stdout }}"
      when: systemd_version.rc == 0

    - name: Fail if systemd version is not 249.11-0ubuntu3.22
      ansible.builtin.fail:
        msg: "Systemd version: {{ systemd_version.stdout }}"
      when: systemd_version.rc == 0 and systemd_version.stdout != "249.11-0ubuntu3.22"
